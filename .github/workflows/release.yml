name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - id: parse
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  package:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: GitLlama-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # Notes come from the version's CHANGELOG section, or Unreleased when it hasn't been rolled yet.
          python3 scripts/changelog.py notes "$VERSION" > notes.md
          if [ -s notes.md ]; then flags+=(--notes-file notes.md); else flags+=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "GitLlama $VERSION" --verify-tag "${flags[@]}"

  update-version:
    # Record the release on the default branch: the version in Directory.Build.props, and the
    # Unreleased changelog entries moved under the version with a fresh Unreleased section.
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Commit version and changelog
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s:<Version>.*</Version>:<Version>$VERSION</Version>:" Directory.Build.props
          # Only entries present at the tag move; anything merged since stays unreleased.
          git show "$GITHUB_REF_NAME:CHANGELOG.md" > "$RUNNER_TEMP/tag-changelog.md"
          python3 scripts/changelog.py roll "$VERSION" "$(date -u +%F)" "$RUNNER_TEMP/tag-changelog.md"
          if git diff --quiet; then
            echo "Version and changelog already record $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
