name: Build and test
on:
  push:
  pull_request:
concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/GitLlama.Desktop/GitLlama.Desktop.csproj
      - run: dotnet build src/GitLlama.Desktop/GitLlama.Desktop.csproj --no-restore -c Release
      - run: dotnet test tests/GitLlama.Core.Tests/GitLlama.Core.Tests.csproj -c Release
      - run: dotnet test tests/GitLlama.Desktop.Tests/GitLlama.Desktop.Tests.csproj -c Release
